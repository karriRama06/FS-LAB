<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Interactive Product Calculator</h1>

        <label for="productName">Product Name</label>
        <input type="text" id="productName" placeholder="Enter product name">

        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" min="0" placeholder="Enter quantity">

        <label for="price">Price per Product</label>
        <input type="number" id="price" min="0" step="0.01" placeholder="Enter price">

        <p id="error"></p>

        <div class="result">
            <h2>Total Price: ₹<span id="total">0.00</span></h2>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
